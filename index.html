  <!-- Tailwind utilities are pre-built into a static file (see tw.config.cjs).

  <style>
    /* ---- theme tokens ---- */
    :root{
      color-scheme:dark;
      /* base surfaces — near-black Apple palette, neutral (no blue tint) */
      --bg:#0B0B0C; --text:#F5F5F7; --muted:#8E8E93;
      --card:#161618; --card-2:#1C1C1E; --sidebar:#0E0E10;
      --glass:#161618; --glass-strong:#1C1C1E; --border:rgba(255,255,255,.10); --hair:rgba(255,255,255,.06);
      /* brand accents (kept: violet) */
      --accent1:#5B2BBF; --accent2:#6D45D8; --accent3:#8A63E6;
      --jade:#2F9E75; --jade2:#4FBF8F; --gold:#C8A45D; --gold2:#E5C879;
      --steel:#3D6F8E; --steel2:#6C8FA8; --coral:#D97757; --danger:#C94A4A;
      /* radius scale (concentric, iOS-like) */
      --r-xs:.5rem; --r-sm:.7rem; --r-md:.9rem; --r-lg:1.15rem; --r-xl:1.4rem; --r-2xl:1.75rem; --r-full:9999px;
      /* elevation */
      --shadow-sm:0 1px 2px rgba(0,0,0,.45),0 1px 1px rgba(0,0,0,.3);
      --shadow-md:0 8px 24px -10px rgba(0,0,0,.55),0 2px 6px -2px rgba(0,0,0,.4);
      --shadow-lg:0 28px 64px -22px rgba(0,0,0,.7),0 10px 26px -14px rgba(0,0,0,.5);
      --shadow-glass:0 18px 50px -16px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
      /* liquid-glass material */
      --glass-blur:22px; --glass-sat:160%;
      --glass-bg:rgba(28,28,30,.66); --glass-bd:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.14);
      /* focus + motion + type */
      --ring:var(--accent2);
      --ease-spring:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.22,1,.36,1);
      --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','system-ui','Segoe UI',sans-serif;
    }
    /* ============================================================
       DESIGN SYSTEM · FOUNDATION TOKENS
       Full 50–900 scales for every semantic color, plus a fluid
       type scale. Purely additive — existing tokens keep working.
       ============================================================ */
    :root{
      /* primary purple (brand) */
      --purple-50:#F3EFFC;--purple-100:#E5DCF8;--purple-200:#CBB9F1;--purple-300:#AC90E8;--purple-400:#8A63E6;--purple-500:#6D45D8;--purple-600:#5B2BBF;--purple-700:#4B2E83;--purple-800:#3A2266;--purple-900:#281745;
      /* royal blue */
      --blue-50:#EFF4FC;--blue-100:#DBE6F8;--blue-200:#B4CCF1;--blue-300:#84A9E6;--blue-400:#5585D8;--blue-500:#3B6BC4;--blue-600:#2F55A0;--blue-700:#27447F;--blue-800:#1E3460;--blue-900:#152443;
      /* emerald / success */
      --emerald-50:#ECF8F2;--emerald-100:#D3EFE2;--emerald-200:#A6DFC4;--emerald-300:#73CBA2;--emerald-400:#45B083;--emerald-500:#2F8F72;--emerald-600:#27775F;--emerald-700:#1F5F4C;--emerald-800:#17473A;--emerald-900:#0F3027;
      /* warning amber */
      --amber-50:#FDF6EA;--amber-100:#FAEACC;--amber-200:#F4D496;--amber-300:#ECBB5E;--amber-400:#E0A231;--amber-500:#C98A18;--amber-600:#A66F12;--amber-700:#84580F;--amber-800:#63420C;--amber-900:#422C08;
      /* danger red */
      --red-50:#FBEFED;--red-100:#F6DAD6;--red-200:#ECB3AB;--red-300:#DF8A7E;--red-400:#CF6455;--red-500:#B8503E;--red-600:#9A4031;--red-700:#7B3327;--red-800:#5C261D;--red-900:#3E1913;
      /* premium gold */
      --gold-50:#FBF6EA;--gold-100:#F5EACC;--gold-200:#EAD399;--gold-300:#DDBB68;--gold-400:#CFA347;--gold-500:#C6A15B;--gold-600:#A5823C;--gold-700:#84672F;--gold-800:#634C23;--gold-900:#423217;
      /* neutral gray */
      --gray-50:#F7F7F8;--gray-100:#EDEEF1;--gray-200:#D9DBE1;--gray-300:#B9BEC9;--gray-400:#98A0AC;--gray-500:#6E7683;--gray-600:#565D69;--gray-700:#434955;--gray-800:#2A2F3A;--gray-900:#16181F;
    }
    /* fluid type scale — one voice for every heading and label */
    .t-hero{font-size:clamp(2.7rem,6.4vw,4.7rem);line-height:1.02;letter-spacing:-.035em;font-weight:800}
    .t-display{font-size:clamp(2.1rem,4.4vw,3.2rem);line-height:1.06;letter-spacing:-.025em;font-weight:800}
    .t-h1{font-size:clamp(1.7rem,2.8vw,2.25rem);line-height:1.1;letter-spacing:-.02em;font-weight:800}
    .t-h2{font-size:clamp(1.35rem,2.2vw,1.7rem);line-height:1.15;letter-spacing:-.015em;font-weight:700}
    .t-h3{font-size:clamp(1.1rem,1.7vw,1.3rem);line-height:1.25;letter-spacing:-.01em;font-weight:700}
    .t-h4{font-size:1rem;line-height:1.35;font-weight:700}
    .t-body-lg{font-size:1.05rem;line-height:1.6}
    .t-body{font-size:.92rem;line-height:1.6}
    .t-caption{font-size:.78rem;line-height:1.45;color:var(--muted)}
    .t-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    /* full-color modes — accent + a tinted background for dark mode */
    html[data-accent="blue"]  {--accent1:#5B2BBF;--accent2:#6D45D8;--accent3:#8A63E6;--bg:#0B0B0C}
    html[data-accent="green"] {--accent1:#059669;--accent2:#22c55e;--accent3:#4ade80;--bg:#06140d}
    html[data-accent="yellow"]{--accent1:#ca8a04;--accent2:#eab308;--accent3:#facc15;--bg:#15120a}
    html[data-accent="orange"]{--accent1:#ea580c;--accent2:#f97316;--accent3:#fb923c;--bg:#160c06}
    html[data-accent="pink"]  {--accent1:#db2777;--accent2:#ec4899;--accent3:#f472b6;--bg:#170a12}
    html[data-accent="red"]   {--accent1:#dc2626;--accent2:#ef4444;--accent3:#f87171;--bg:#180809}
    html[data-accent="grey"]  {--accent1:#4b5563;--accent2:#6b7280;--accent3:#9ca3af;--bg:#0e0f12}
    /* light mode */
    html.light{
      color-scheme:light;
      /* white system: pure white, graphite text, blue/green accents (no default purple) */
      --bg:#FFFFFF; --text:#111114; --muted:#6E6E73;
      --card:#FFFFFF; --card-2:#F6F6F8; --sidebar:#FFFFFF; --glass:#FFFFFF; --glass-strong:#FFFFFF; --border:#E5E5EA; --hair:rgba(17,17,20,.06);
      --accent1:#1D4ED8; --accent2:#2563EB; --accent3:#60A5FA;
      --shadow-sm:0 1px 2px rgba(17,24,39,.06),0 1px 1px rgba(17,24,39,.04);
      --shadow-md:0 8px 24px -12px rgba(17,24,39,.18),0 2px 6px -2px rgba(17,24,39,.10);
      --shadow-lg:0 28px 60px -24px rgba(17,24,39,.26),0 8px 22px -12px rgba(17,24,39,.14);
      --shadow-glass:0 16px 50px -18px rgba(17,24,39,.22),inset 0 1px 0 rgba(255,255,255,.7);
      --glass-bg:rgba(255,255,255,.62); --glass-bd:rgba(0,0,0,.08); --glass-hi:rgba(255,255,255,.85);
    }
    body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;transition:background .4s var(--ease-out),color .4s var(--ease-out);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
    /* instant taps: kill the double-tap-zoom delay and iOS grey tap flash */
    a,button,input,select,textarea,label,[data-action]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    h1,h2,h3,h4{letter-spacing:-.021em}
    ::selection{background:color-mix(in srgb,var(--accent2) 32%,transparent);color:#fff}

    /* ---- base surfaces: refined SOLID cards (readable + fast, not glass) ---- */
    .glass{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--border);box-shadow:var(--shadow-md)}
    .glass-strong{background:linear-gradient(180deg,var(--glass-strong),var(--card));border:1px solid var(--border);box-shadow:var(--shadow-lg)}
    html.light .glass{background:#fff;border-color:var(--border);box-shadow:var(--shadow-sm)}
    html.light .glass-strong{background:#fff;border-color:var(--border);box-shadow:var(--shadow-md)}

    /* ---- selective Liquid Glass — opt-in premium surfaces only ---- */
    .lg{position:relative;background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));border:1px solid var(--glass-bd);box-shadow:var(--shadow-glass)}
    .lg::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,var(--glass-hi),transparent 55%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .glass-nav{position:relative;background:color-mix(in srgb,var(--bg) 60%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--glass-bd)}
    .glass-panel{position:relative;background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));border:1px solid var(--glass-bd);box-shadow:var(--shadow-glass)}
    .glass-modal{position:relative;background:color-mix(in srgb,var(--glass-strong) 84%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-bd);box-shadow:var(--shadow-lg)}
    .glass-menu{position:relative;background:color-mix(in srgb,var(--glass-strong) 88%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-bd);box-shadow:var(--shadow-lg)}
    .glass-pill{background:color-mix(in srgb,var(--text) 6%,transparent);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--glass-bd)}
    .glass-hover{transition:transform .25s var(--ease-spring),box-shadow .25s var(--ease-spring),border-color .25s}
    .glass-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent2) 40%,var(--border))}
    /* graceful fallback where backdrop-filter is unsupported or user prefers less transparency */
    @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
      .lg,.glass-nav,.glass-panel,.glass-modal,.glass-menu,.glass-pill{background:var(--glass-strong)!important}
    }
    @media (prefers-reduced-transparency:reduce){
      .lg,.glass-nav,.glass-panel,.glass-modal,.glass-menu,.glass-pill{background:var(--glass-strong)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
    }

    .gtext{background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}
    /* hero headline — centered layout gets a subtle glow so "progress." feels like the focal point */
    .lp-h1-glow{max-width:16ch}
    .lp-glow{position:relative;filter:drop-shadow(0 6px 28px color-mix(in srgb,var(--accent2) 45%,transparent))}
    @media(prefers-reduced-motion:reduce){.lp-glow{filter:none}}

    /* ---- buttons ---- */
    .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--r-md);padding:.72rem 1.4rem;font-weight:600;font-size:.9rem;line-height:1;letter-spacing:-.01em;transition:transform .2s var(--ease-spring),box-shadow .2s var(--ease-spring),background .2s,filter .2s,border-color .2s;cursor:pointer;border:1px solid transparent;text-decoration:none;-webkit-tap-highlight-color:transparent;user-select:none}
    .btn:active{transform:scale(.97);transition-duration:.06s}
    .btn-sm{padding:.5rem 1rem;font-size:.82rem;border-radius:var(--r-sm)}
    .btn-lg{padding:.95rem 1.7rem;font-size:1rem;border-radius:var(--r-lg)}
    /* dark (default): white primary with black text — Apple HIG, no glow/gradient */
    .btn-primary{color:#0B0B0C;background:#F5F5F7;box-shadow:0 1px 2px rgba(0,0,0,.4)}
    .btn-primary:hover{background:#fff}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px color-mix(in srgb,var(--accent2) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.25);filter:saturate(1.05)}
    .btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;filter:saturate(.7)}
    .btn-ghost{color:var(--text);background:#1C1C1E;border-color:rgba(255,255,255,.12)}
    .btn-ghost:hover{background:#242426}
    .btn-danger{color:#fff;background:#D9605C;box-shadow:0 8px 20px -12px rgba(217,96,92,.6)}
    .btn-danger:hover{filter:brightness(1.06)}
    .btn-success{color:#fff;background:#3E9C7A;box-shadow:0 8px 20px -12px rgba(62,156,122,.6)}
    .btn-success:hover{filter:brightness(1.06)}
    .btn-ghost:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--text) 9%,transparent);border-color:color-mix(in srgb,var(--accent2) 35%,var(--border))}
    .btn-glass{color:var(--text);background:var(--glass-bg);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border-color:var(--glass-bd)}
    .btn-glass:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent2) 45%,var(--glass-bd))}

    .orb{position:absolute;border-radius:9999px;filter:blur(80px);opacity:.5;pointer-events:none}

    /* ---- inputs ---- */
    .input{width:100%;box-sizing:border-box;border-radius:var(--r-md);border:1px solid var(--border);background:color-mix(in srgb,var(--text) 3%,transparent);padding:.7rem 1rem;font-size:.9rem;outline:none;color:var(--text);transition:border-color .18s,box-shadow .18s,background .18s}
    html.light .input{background:#fff}
    .input::placeholder{color:color-mix(in srgb,var(--muted) 85%,transparent)}
    .input:hover{border-color:color-mix(in srgb,var(--accent2) 30%,var(--border))}
    .input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 28%,transparent)}
    .label{margin-bottom:.35rem;display:block;font-size:.8rem;font-weight:500;color:var(--muted)}

    /* ---- accessible keyboard focus ring ---- */
    :where(a,button,[role=button],input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
    ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent1),var(--accent2));border-radius:8px}
    html.light ::-webkit-scrollbar-thumb{background:#C9C6BF}
    html.light ::-webkit-scrollbar-track{background:transparent}
    .grid-bg{background-image:linear-gradient(rgba(128,128,128,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(128,128,128,.08) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 75%)}
    .nav-link.active{background:linear-gradient(90deg,var(--glass-strong),var(--glass))}
    .toast{position:fixed;bottom:1.25rem;right:1.25rem;z-index:80;border-radius:.75rem;padding:.75rem 1rem;font-size:.875rem}
    .anim{animation:fadeUp .5s ease forwards}
    /* same-route re-renders (button taps) skip entrance animations, so a tap
       gives instant feedback instead of replaying the whole page */
    .no-anim .anim,.no-anim .reveal,
    .no-anim .dash-stack>*,.no-anim .rec-list>*{animation:none!important;opacity:1!important;transform:none!important;transition:none!important}
    /* .dash-stack already staggers further down; .rec-list matches its timing
       so the recurring list assembles top-down the same way. */
    .rec-list>*{animation:fadeUp .5s ease both}
    .rec-list>*:nth-child(2){animation-delay:.04s}.rec-list>*:nth-child(3){animation-delay:.08s}
    .rec-list>*:nth-child(4){animation-delay:.12s}.rec-list>*:nth-child(5){animation-delay:.16s}
    .rec-list>*:nth-child(6){animation-delay:.20s}.rec-list>*:nth-child(n+7){animation-delay:.24s}
    /* category glyphs + toast icon: keep icons optically aligned with text */
    .cat-ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
    .toast-in{display:inline-flex;align-items:center;gap:.5rem}
    .toast-in svg{flex-shrink:0;opacity:.9}
    .auth-bi svg,.lp-ico svg{display:block}
    /* hero mockup: icons sit inline with their labels */
    .ds-streak svg,.ds-goal-n svg,.ds-mini svg,.ds-badge svg{display:inline-block;vertical-align:-2px}
    .ds-coach-ic svg{display:block}
    .ds-mini>span,.ds-badge{display:inline-flex;align-items:center;gap:.3rem}
    .ds-tx-ic svg,.pm-nav-i svg{display:block}
    .ds-tx-ic{display:inline-flex;align-items:center;justify-content:center}
    .pm-nav-i{display:inline-flex;align-items:center;justify-content:center}
    .pm-hi svg,.pm-goal-n svg{display:inline-block;vertical-align:-2px}
    /* Premium · safe-to-spend */
    .sts-num{font-size:clamp(2.2rem,5vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:.15rem}
    .sts-break{display:grid;gap:.3rem;font-size:.82rem;min-width:11rem}
    .sts-break>div{display:flex;justify-content:space-between;gap:1.2rem}
    /* Premium · bill calendar */
    .bc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.28rem}
    .bc-day{position:relative;min-height:3.1rem;border-radius:.55rem;padding:.3rem .35rem;border:1px solid var(--hair);
      background:color-mix(in srgb,var(--text) 2.5%,transparent);display:flex;flex-direction:column;gap:.1rem}
    .bc-d{font-size:.68rem;color:var(--muted)}

    /* ---- decorative background designs (paid plans) ---- */
    body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:var(--bg);transition:opacity .5s}

      radial-gradient(at 48% 82%, color-mix(in srgb,var(--accent3) 48%,transparent), transparent 45%),

      background-size:42px 42px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
    html[data-bg="dots"] body::after{opacity:.5;background-image:radial-gradient(color-mix(in srgb,var(--accent2) 40%,transparent) 1.4px,transparent 1.4px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 80%)}
    /* ============================================================

    html[data-route="app-analytics"] body::before,html[data-route="app-simulator"] body::before,html[data-route="app-spendcalc"] body::before{background:radial-gradient(56% 40% at 75% -8%,color-mix(in srgb,var(--steel) 15%,transparent),transparent 70%),var(--bg)}
    html[data-route="app-challenges"] body::before{background:radial-gradient(56% 40% at 50% -10%,color-mix(in srgb,var(--coral) 12%,transparent),transparent 70%),var(--bg)}
    html[data-route="app-social"] body::before,html[data-route="app-inbox"] body::before{background:radial-gradient(56% 40% at 25% -8%,color-mix(in srgb,var(--accent3) 11%,transparent),transparent 70%),var(--bg)}
    html[data-route="app-profile"] body::before{background:radial-gradient(56% 42% at 50% -10%,color-mix(in srgb,var(--accent3) 13%,transparent),transparent 70%),var(--bg)}
    html[data-route="app-plans"] body::before,html[data-route="app-rewards"] body::before{background:radial-gradient(56% 40% at 80% -8%,color-mix(in srgb,var(--gold) 13%,transparent),transparent 70%),var(--bg)}
    html[data-route="app-student"] body::before{background:radial-gradient(50% 38% at 15% -8%,color-mix(in srgb,var(--jade) 11%,transparent),transparent 70%),radial-gradient(44% 34% at 90% -6%,color-mix(in srgb,var(--gold) 10%,transparent),transparent 70%),var(--bg)}

    html[data-route="success"] body::before{background:radial-gradient(50% 40% at 25% -6%,color-mix(in srgb,var(--jade) 14%,transparent),transparent 70%),radial-gradient(50% 40% at 80% -8%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 70%),var(--bg)}

    /* branded boot splash — fixed overlay, faded out by app.js on first paint */

    /* ============================================================

    html[data-biz="1"]{

      --glass:rgba(212,175,55,.045); --glass-strong:rgba(212,175,55,.08);

    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}

    /* ============================================================
       LANDING V4 — WARM PORCELAIN FINTECH SURFACE
       Ink text · ivory surfaces · plum as accent only · dark
       dashboard framing · hero above the fold at 1280x720.
       ============================================================ */
    /* warm light tokens (landing forces light + default accent) */
    html.light[data-accent="blue"]{
      --bg:#FFFFFF; --text:#111114; --muted:#6E6E73;
      --card:#FFFFFF; --card-2:#F6F6F8; --sidebar:#FFFFFF;
      --glass:#FFFFFF; --glass-strong:#FFFFFF;
      --border:#E5E5EA; --hair:rgba(17,17,20,.06);
      --accent1:#1D4ED8; --accent2:#2563EB; --accent3:#60A5FA;
      --jade:#2F8F72; --jade2:#45B083; --gold:#C6A15B; --gold2:#B98F3E;
      --steel:#426C82; --steel2:#6E91A3; --coral:#C96F4A; --danger:#B8503E;
      --shadow-sm:0 1px 2px rgba(70,58,32,.08),0 1px 1px rgba(70,58,32,.05);
      --shadow-md:0 10px 28px -14px rgba(70,58,32,.20),0 3px 8px -3px rgba(70,58,32,.10);
      --shadow-lg:0 32px 64px -28px rgba(52,44,26,.28),0 10px 24px -14px rgba(70,58,32,.14);
      --shadow-glass:0 18px 44px -18px rgba(70,58,32,.20),inset 0 1px 0 #fff;
    }
    /* hero: no purple blobs, warm wash, tight above-the-fold rhythm */
    html.light .lp-aurora{display:none}
    html.light .lp-haze{opacity:.5}
    .lp-hero{padding-top:calc(58px + clamp(2rem,4.5vh,3rem))!important;padding-bottom:clamp(1.75rem,3.5vw,2.75rem)!important}
    html.light .lp-hero{background:linear-gradient(180deg,#F8F5EF 0%,var(--bg) 68%)}
    .lp-h1{font-size:clamp(2.35rem,4.9vw,3.85rem)}
    .lp-lead{font-size:clamp(1rem,1.3vw,1.12rem)}
    /* navbar: warm glass, crisper */
    html.light .lp-navbar{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--border);box-shadow:0 10px 26px -18px rgba(70,58,32,.35)}
    /* CTA hierarchy */
    /* porcelain button hierarchy — black primary, white secondary, purple stays an accent */
    /* black button MUST have white text — base .btn-primary sets dark text for dark mode's
       white button, so without this override light mode rendered black-on-black ("Start for free" bug) */
    html.light .btn-primary{color:#fff;background:#111114;box-shadow:0 10px 22px -12px rgba(17,17,20,.55)}
    html.light .btn-primary:hover{filter:brightness(1.25)}
    html.light .btn-ghost{background:#fff;border-color:#DCD9D3;box-shadow:var(--shadow-sm)}
    html.light .btn-primary:hover{filter:brightness(1.07)}
    html.light .btn-primary:active{transform:translateY(1px)}
    html.light .lp-btn-lg.btn-ghost,html.light .lp-navbar .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow-sm)}
    html.light .lp-btn-lg.btn-ghost:hover{border-color:#B9AE9C;box-shadow:var(--shadow-md)}

    html.light .lp-eyebrow{background:#fff;border-color:var(--border);color:#3A3F47;box-shadow:var(--shadow-sm)}
    html.light .lp-eyebrow .dot{background:var(--jade);box-shadow:0 0 0 4px rgba(47,143,114,.16)}

    html.light .lp-frame{
      --bg:#101218; --card:#161922; --card-2:#1A1E28; --sidebar:#12151C;
      --glass:#1E222C; --glass-strong:#1A1E28; --border:#2A2F3A; --hair:rgba(255,255,255,.06);

      box-shadow:0 48px 96px -42px rgba(24,20,10,.5),0 18px 40px -22px rgba(24,20,10,.3),0 0 0 6px rgba(255,255,255,.55);
      -webkit-backdrop-filter:none;backdrop-filter:none}
    html.light .lp-frame *{color:var(--text)}
    html.light .lp-frame .lp-frame-bar i{background:#3A4150}

    html.light .lp-stat .n{background:none;-webkit-text-fill-color:currentColor;color:var(--text)}
    html.light .lp-stat .n::after{content:"";display:inline-block;width:.45em;height:.14em;margin-left:.18em;border-radius:2px;background:var(--jade2);vertical-align:.18em}
    /* cards / faq / pricing inherit warm tokens; sharpen borders */
    html.light .lp-card,html.light .lp-persona,html.light .lp-price,html.light .lp-faq,html.light .lp-sec-tile,html.light .lp-bento .cell{border-color:var(--border)}

    /* section rhythm: tighter, alternating warm bands */

    html.light #sec-how,html.light #sec-faq{position:relative}

    /* ============================================================

    html.light .lang-btn{background:linear-gradient(135deg,#FFFDF8,#F1EEE7);border-color:#D8CDBD;box-shadow:0 10px 24px -18px rgba(70,58,32,.28),inset 0 1px 0 rgba(255,255,255,.9)}
    .lang-btn:hover{border-color:color-mix(in srgb,var(--jade) 58%,var(--border));box-shadow:0 16px 30px -18px color-mix(in srgb,var(--jade) 40%,transparent);transform:translateY(-1px)}
    .lang-btn:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

      --sp-2:clamp(.5rem,.4rem + .5vw,1rem);
      --sp-3:clamp(.75rem,.6rem + .75vw,1.5rem);
      --sp-4:clamp(1rem,.8rem + 1vw,2rem);
      --sp-6:clamp(1.5rem,1.1rem + 1.6vw,3rem);
      --sp-8:clamp(2rem,1.4rem + 2.4vw,4.5rem);
    }
    /* overflow safety — nothing may push the page sideways */
    html,body{max-width:100%;overflow-x:hidden}
    #root{overflow-x:clip}
    /* grid children may always shrink; long words can never blow out a column */
    #root .grid>*{min-width:0}
    h1,h2,h3,h4,p,a,button{overflow-wrap:break-word}
    /* media scales proportionally, never distorts or clips */
    img,video{max-width:100%;height:auto}
    svg{max-width:100%}
    canvas{max-width:100%}
    /* hero dashboard showcase — fluid at every viewport
       (base: stacked stats 2-up, summary cards 2-up + full-width third) */
    .lpv{width:100%;min-height:0}
    .lpv-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .lpv-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    .lpv-cards>div:last-child{grid-column:1 / -1}
    /* 481px+ · tablet: full stat row returns */
    @media(min-width:481px){
      .lpv-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
      .lpv-cards{grid-template-columns:repeat(3,minmax(0,1fr))}
      .lpv-cards>div:last-child{grid-column:auto}
    }
    /* 769px+ · laptop: showcase regains its designed height */
    @media(min-width:769px){
      .lpv{min-height:420px}
    }
    /* 1025px+ · large desktop: showcase sidebar visible (matches .lp-side) */
    @media(min-width:1025px){
      .lpv{min-height:440px}
    }
    /* ============================================================
       MOBILE HEADER & HERO — spec-true mobile experience
       Sticky in-flow header (never overlaps content), aligned rows,
       ≥44px touch targets, stacked trust list, mobile type scale.
       ============================================================ */
    /* liquid-glass navbar — iOS-style translucent bar, pinned while scrolling */
    .lp-navbar{position:relative;background:color-mix(in srgb,var(--bg) 50%,transparent);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:1px solid var(--glass-bd);box-shadow:var(--shadow-glass)}
    .lp-navbar::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,var(--glass-hi),transparent 55%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    html.light .lp-navbar{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 32px -18px rgba(70,58,32,.35),inset 0 1px 0 rgba(255,255,255,.85)}
    @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.lp-navbar{background:var(--glass-strong)!important}}
    .mnav-panel{background:color-mix(in srgb,var(--glass-strong) 78%,transparent);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
    html.light .mnav-panel{background:rgba(255,253,248,.72)}
    .mnav-lang{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border-radius:.6rem;padding:.5rem .9rem}
    .mnav-lang>span{font-size:.85rem;font-weight:600;color:var(--muted)}
    @media(max-width:640px){
      /* sticky = pinned AND in flow (content can never slide underneath);
         with the language selector living in the menu, the bar is one slim row */
      /* slimmer bar, dropped below the status bar / notch (iPhone safe area) */
      html[data-route="home"] header.fixed{position:sticky;top:0;padding:calc(1rem + env(safe-area-inset-top)) .75rem .35rem}
      html[data-route="home"] .lp-hero{padding-top:1.4rem!important}
      .lp-navbar{align-items:center;padding:.3rem .55rem .3rem .75rem!important;border-radius:1.05rem}
      .lp-navbar .btn{min-height:2.15rem;padding:.4rem .9rem;font-size:.85rem}
      .mnav-btn{width:2.15rem;height:2.15rem;font-size:1.05rem}
      .mnav-lang .lang-btn{height:2.5rem;padding:0 .8rem;font-size:.8rem}
      /* hero CTAs: full width, thumb-friendly 48px */
      .lp-hero .btn{min-height:3rem}
      /* trust list: one signal per line, scannable */
      .lp-hero .gap-x-6{flex-direction:column;align-items:flex-start;gap:.55rem}
    }
    /* mobile typography scale — H1 28-32 · H2 22-24 · lead 15-16 */
    @media(max-width:480px){
      .lp-h1{font-size:clamp(1.75rem,8.5vw,2rem)}
      .lp-h2{font-size:clamp(1.4rem,6.5vw,1.5rem)}
      .lp-lead{font-size:.95rem;line-height:1.6}
      .lp-eyebrow{font-size:.74rem;padding:.38rem .8rem .38rem .62rem}
    }
    /* hamburger menu: smooth slide-down on open */
    @keyframes menuIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
    .mnav-panel:not(.hidden){animation:menuIn .22s var(--ease-out) both}
    @media(prefers-reduced-motion:reduce){.mnav-panel:not(.hidden){animation:none}}
    /* signup consent rows */
    .su-consent{display:flex;align-items:flex-start;gap:.55rem;font-size:.74rem;line-height:1.45;color:var(--muted);cursor:pointer}
    .su-consent input{margin-top:.15rem;width:1rem;height:1rem;accent-color:var(--accent2);flex-shrink:0;cursor:pointer}
    .su-consent a{white-space:nowrap}
    /* privacy & terms page */
    .legal-shell{max-width:46rem;margin:0 auto;padding:1rem 1rem 4rem}
    .legal-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 0 1.25rem}
    .legal-wrap{border-radius:1.25rem;padding:clamp(1.5rem,4vw,2.5rem)}
    html.light .legal-wrap{background:#FFFCF7;border-color:#DDD6CA}
    .legal-sec{margin-top:1.7rem}
    .legal-sec p,.legal-sec ul{margin-top:.5rem;font-size:.92rem;line-height:1.7;color:var(--muted)}
    .legal-sec b{color:var(--text)}
    .legal-sec ul{list-style:disc;padding-left:1.25rem;display:flex;flex-direction:column;gap:.4rem}
    /* ---- touch targets: interactive controls reach ≥36px on touch/small
       screens without changing the visual density of the desktop layout ---- */
    @media(max-width:640px),(pointer:coarse){
      .mhead select.input{min-height:2.4rem;padding:.45rem .55rem!important}
      .seg .seg-btn{min-height:2.25rem}
      .icon-btn{width:2.4rem;height:2.4rem}
      .app-main button.py-1\.5{min-height:2.1rem}
      .app-main button.h-7.w-7{height:2.15rem!important;width:2.15rem!important}
      /* tiny inline text actions: grow the hit area, not the layout */
      .app-main button.text-xs:not(.btn):not(.seg-btn){padding:.3rem .35rem;margin:-.3rem -.35rem}
    }
  </style>
</head>
<body>
  <!-- shared SVG gradients (theme-token driven) referenced by hero ring + teaser chart -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="hdGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent1)"/><stop offset="1" stop-color="var(--accent3)"/></linearGradient>
    <linearGradient id="ltLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent1)"/><stop offset="1" stop-color="var(--accent3)"/></linearGradient>
    <linearGradient id="ltArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent2)" stop-opacity="0.35"/><stop offset="1" stop-color="var(--accent2)" stop-opacity="0"/></linearGradient>
  </defs></svg>
  <div id="root" class="min-h-screen"></div>
  <div id="modal"></div>
  <div id="toast"></div>
  <script>
    /* Shared scroll-reveal: reveals .reveal elements as they enter the viewport.
       SPA-aware (watches #root for re-renders); respects reduced motion. */
    (function(){
      var io=null;
      function obs(){
        if(io) return io;
        if(!('IntersectionObserver' in window)) return null;
        io=new IntersectionObserver(function(entries){
          entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
        },{rootMargin:'0px 0px -8% 0px',threshold:.08});
        return io;
      }
      function scan(){
        var o=obs();
        var nodes=document.querySelectorAll('.reveal:not(.in)');
        if(!o){ nodes.forEach(function(el){ el.classList.add('in'); }); return; }
        var vh=window.innerHeight||document.documentElement.clientHeight;
        nodes.forEach(function(el){
          if(el.getBoundingClientRect().top < vh*0.95){ el.classList.add('in'); }
          else { o.observe(el); }
        });
      }
      var root=document.getElementById('root');
      if(root && 'MutationObserver' in window){
        new MutationObserver(function(){ requestAnimationFrame(scan); }).observe(root,{childList:true,subtree:true});
      }
      document.addEventListener('DOMContentLoaded',scan);
      window.addEventListener('load',scan);
    })();
  </script>
  <script type="module" src="./app.js?v=123"></script>
</body>
